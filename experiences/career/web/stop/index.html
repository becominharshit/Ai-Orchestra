<!doctype html>
<html lang="en" data-exp="career">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070618">
  <title>STOP WhatsApp · Zenith Career Studio</title>
  <link rel="stylesheet" href="/core/tokens.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="stage">
  <main class="pz-wrap cs">
    <header class="cs-head"><a class="pz-brand" href="/"><i></i>Zenith</a><span class="cs-head-name">Career Studio</span></header>
    <section class="cs-screen" id="s-stop">
      <div class="pz-kicker">STOP</div>
      <h1 class="pz-display cs-h2">WhatsApp <span class="pz-grad-text">band karo</span></h1>
      <p class="pz-dim">Apna number likho. Is number pe Career Studio (Zenith School of AI) WhatsApp nahi bhejega.</p>
      <form id="stop-form" class="pz-stack" autocomplete="off" novalidate>
        <label class="pz-field"><span>WhatsApp number</span>
          <input class="pz-input" name="phone" inputmode="numeric" maxlength="15" placeholder="10 digit mobile number" required></label>
        <p class="cs-err" id="stop-msg" role="status" hidden></p>
        <button class="pz-btn block" type="submit">STOP karo</button>
      </form>
      <p class="cs-optout" style="margin-top:16px !important">WhatsApp pe STOP likhna bhi kaafi hai, ya counter pe bolo.</p>
    </section>
  </main>
  <script type="module" src="./stop.js"></script>
</body>
</html>
